[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-dw"
version = "0.1.0"
description = "Backward-only residual gradient routing with plug-in dual Wiener gains"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
paper = [
  "h5py",
  "matplotlib",
  "nibabel",
  "nilearn",
  "pandas",
  "scikit-learn",
  "scipy",
  "seaborn",
]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

